[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuewatch"
version = "0.1.0"
description = "Python CLI for running background jobs, tracking them, retrying failures and explaining errors with AI."
requires-python = ">=3.9"
dependencies = ["typer>=0.12", "rich>=13.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
queuewatch = "queuewatch.main:app"

[tool.setuptools]
packages = ["queuewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
